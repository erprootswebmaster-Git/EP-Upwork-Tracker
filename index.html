<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {

.wrap { max-width: 1100px; margin: 0 auto; }
header { margin-bottom: 20px; }

.card { background: #fff; border: 1px solid #e6e4df; border-radius: 10px; padding: 14px 16px; }

.chartbox { position: relative; height: 240px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #8a8a83; border-bottom: 1px solid #e6e4df; padding: 8px 10px; font-weight: 600; }
td { padding: 8px 10px; border-bottom: 1px solid #f0eeea; vertical-align: top; }
tr:last-child td { border-bottom: none; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.pill.yes { background: #e8f2ec; color: #2f6446; }
.pill.no { background: #f2f1ee; color: #8a8a83; }
.pill.unk { background: #fdf3e7; color: #8a5a26; }
.pill.hot { background: #fbe9e2; color: #a04a26; }
.controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
button { font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 6px; border: 1px solid #ddd9d2; background: #fff; color: #4a4a45; cursor: pointer; }
button.on { background: #1a1a18; color: #fff; border-color: #1a1a18; }
.foot { font-size: 12px; color: #8a8a83; margin-top: 18px; padding-top: 14px; border-top: 1px solid #e6e4df; }
.alert { background: #fdf3e7; border: 1px solid #f0dcc0; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; }
.alert b { color: #8a5a26; }
</style>

<body>

];

const total = D.length;
const known = D.filter(r => r[2] !== null);
const viewed = D.filter(r => r[2] === 1).length;
const replied = D.filter(r => r[3] === 1).length;
const unknown = total - known.length;
const converted = D.filter(r => r[4] === "CONVERTED").length;
const vRate = known.length ? Math.round(viewed / known.length * 100) : 0;
const rRate = viewed ? Math.round(replied / viewed * 100) : 0;

document.getElementById("cards").innerHTML = [
  ["Proposals sent", total, "since 25 Jun"],
  ["Viewed by client", viewed, vRate + "% of " + known.length + " known"],
  ["Client replied", replied, rRate + "% of viewed"],
  ["Converted", converted, "1 contract won"],
  ["Status unknown", unknown, "archived, Upwork hides it"]
].map((c, i) =>
  '<div class="card"><div class="label">' + c[0] + '</div><div class="val' +
  (i === 3 ? ' good' : i === 4 ? ' accent' : '') + '">' + c[1] +
  '</div><div class="note">' + c[2] + '</div></div>'
).join("");

const hot = D.filter(r => r[4] === "OPEN THREAD");
document.getElementById("hot").innerHTML = hot.length
  ? '<b>Needs attention:</b> ' + hot.map(r => r[1] + " (" + r[0] + ")").join(", ") + " &mdash; client replied, no offer yet."
  : "No open client threads right now.";

// weekly buckets
const wkMap = {};
D.forEach(r => {
  const d = new Date(r[0] + "T00:00:00");
  const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const k = mon.toISOString().slice(0, 10);
  if (!wkMap[k]) wkMap[k] = { n: 0, v: 0 };
  wkMap[k].n++; if (r[2] === 1) wkMap[k].v++;
});
const wks = Object.keys(wkMap).sort();
const fmt = k => new Date(k + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });

new Chart(document.getElementById("wk"), {
  type: "bar",
  data: {
    labels: wks.map(fmt),
    datasets: [
      { label: "Sent", data: wks.map(k => wkMap[k].n), backgroundColor: "#d6d2c8", borderRadius: 4 },
      { label: "Viewed", data: wks.map(k => wkMap[k].v), backgroundColor: "#b4633a", borderRadius: 4 }
    ]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } },
    scales: {
      x: { grid: { display: false }, ticks: { font: { size: 11 } } },
      y: { beginAtZero: true, ticks: { precision: 0, font: { size: 11 } }, grid: { color: "#f0eeea" } }
    }
  }
});

const pill = v => v === null ? '<span class="pill unk">?</span>'
  : v === 1 ? '<span class="pill yes">Yes</span>' : '<span class="pill no">No</span>';

let filter = "all";
function render() {
  const rows = D.filter(r =>
    filter === "all" ? true :
    filter === "viewed" ? r[2] === 1 :
    filter === "replied" ? r[3] === 1 :
    r[2] === null
  ).slice().reverse();
  document.getElementById("tb").innerHTML = rows.map(r =>
    "<tr><td>" + new Date(r[0] + "T00:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) +
    "</td><td>" + r[1] + "</td><td>" + pill(r[2]) + "</td><td>" + pill(r[3]) + "</td><td>" +
    (r[4] === "OPEN THREAD" ? '<span class="pill hot">Open thread</span>'
     : r[4] === "CONVERTED" ? '<span class="pill yes">Won</span>'
     : '<span style="color:#8a8a83;font-size:12px">' + r[4] + "</span>") +
    "</td></tr>"
  ).join("");
}
document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-f]").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.f; render();
});
render();

document.getElementById("foot").textContent =
  "Last scraped " + new Date(SCRAPED + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) +
  ". Refreshed automatically Mondays and Thursdays at 9am. Upwork removes the view indicator once a job closes, so archived proposals show an unknown status.";
